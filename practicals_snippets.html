<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyPracticals — Lab Code Library</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --orange: #fb923c;
    --pink: #f472b6;
    --text: #e2e8f0;
    --muted: #64748b;
    --font-mono: 'JetBrains Mono', monospace;
    --font-display: 'Syne', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,14,26,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em; display: flex; align-items: center; gap: 0.5rem; }
  .logo span:first-child { color: var(--accent); }
  .logo-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.85)} }
  .header-meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }

  main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 3rem 2rem 5rem; }

  .hero { text-align: center; margin-bottom: 3rem; animation: fadeUp 0.6s ease both; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; margin-bottom: 0.75rem; }
  .hero h1 em { font-style: normal; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .hero p { color: var(--muted); font-size: 0.95rem; font-family: var(--font-mono); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

  /* Search */
  .search-wrap { margin-bottom: 2rem; animation: fadeUp 0.6s 0.1s ease both; }
  .search-box { display: flex; align-items: center; gap: 0.75rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 1.25rem; transition: border-color 0.2s; }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box svg { color: var(--muted); flex-shrink: 0; }
  .search-box input { background: none; border: none; outline: none; color: var(--text); font-family: var(--font-mono); font-size: 0.9rem; width: 100%; }
  .search-box input::placeholder { color: var(--muted); }

  /* Filter tabs */
  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem; animation: fadeUp 0.6s 0.15s ease both; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.4rem 1rem; border-radius: 100px; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0a0e1a; font-weight: 700; }

  .count-badge { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); margin-bottom: 1.25rem; animation: fadeUp 0.6s 0.2s ease both; }
  .count-badge span { color: var(--accent); font-weight: 700; }

  /* Cards */
  .cards-list { display: flex; flex-direction: column; gap: 1.5rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.25s, box-shadow 0.25s;
    animation: fadeUp 0.5s ease both;
  }
  .card:hover { border-color: var(--accent); box-shadow: 0 8px 40px rgba(56,189,248,0.08); }

  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.25rem; gap: 1rem; cursor: pointer;
    user-select: none;
  }
  .card-header:hover .chevron { color: var(--accent); }

  .card-meta { display: flex; align-items: center; gap: 0.75rem; min-width: 0; flex: 1; }

  .prac-num {
    font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
    padding: 0.25rem 0.65rem; border-radius: 6px; flex-shrink: 0;
    background: rgba(56,189,248,0.12); color: var(--accent);
    border: 1px solid rgba(56,189,248,0.2);
  }

  .tag { font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 5px; flex-shrink: 0; }
  .tag-ml      { background: rgba(129,140,248,0.15); color: var(--accent2); }
  .tag-stats   { background: rgba(74,222,128,0.15); color: var(--green); }
  .tag-nlp     { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .tag-math    { background: rgba(248,113,113,0.15); color: var(--red); }
  .tag-nn      { background: rgba(251,146,60,0.15); color: var(--orange); }
  .tag-cluster { background: rgba(244,114,182,0.15); color: var(--pink); }
  .tag-prob    { background: rgba(56,189,248,0.15); color: var(--accent); }

  .card-title { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }

  .copy-btn {
    display: flex; align-items: center; gap: 0.4rem;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); font-family: var(--font-mono); font-size: 0.75rem;
    padding: 0.35rem 0.85rem; border-radius: 8px; cursor: pointer;
    transition: all 0.2s; white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.08); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); background: rgba(74,222,128,0.08); }

  .chevron { color: var(--muted); transition: transform 0.3s, color 0.2s; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }

  /* Collapsible body */
  .card-body { display: none; border-top: 1px solid var(--border); }
  .card-body.open { display: block; }

  .card-desc { padding: 0.65rem 1.25rem; font-size: 0.78rem; color: var(--muted); font-family: var(--font-mono); border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }

  .code-wrap { padding: 1.1rem 1.25rem; overflow-x: auto; background: #080c18; }
  pre { font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.75; color: #c9d1d9; white-space: pre; }

  /* Syntax */
  .kw  { color: #ff7b72; }
  .fn  { color: #d2a8ff; }
  .st  { color: #a5d6ff; }
  .cm  { color: #8b949e; font-style: italic; }
  .nm  { color: #79c0ff; }
  .op  { color: #ffa657; }
  .cl  { color: #ffa657; }
  .pm  { color: #e6edf3; }
  .dec { color: #4ade80; }

  /* Empty */
  .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); font-family: var(--font-mono); font-size: 0.9rem; }

  /* Toast */
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--green); color: #0a0e1a; font-family: var(--font-mono); font-size: 0.82rem; font-weight: 700; padding: 0.65rem 1.5rem; border-radius: 100px; z-index: 9999; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span>Py</span><span>Practicals</span>
    <div class="logo-dot"></div>
  </div>
  <div class="header-meta">// lab code library</div>
</header>

<main>
  <div class="hero">
    <h1>Lab <em>Practicals</em><br>Code Library</h1>
    <p>&#x2192; click a card to expand &nbsp;·&nbsp; hit copy &nbsp;·&nbsp; paste &amp; run.</p>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search practicals..." oninput="filterCards()">
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('ml',this)">ML / PCA</button>
    <button class="filter-btn" onclick="setFilter('stats',this)">Statistics</button>
    <button class="filter-btn" onclick="setFilter('nlp',this)">NLP / Similarity</button>
    <button class="filter-btn" onclick="setFilter('math',this)">Math / Optimization</button>
    <button class="filter-btn" onclick="setFilter('nn',this)">Neural Networks</button>
    <button class="filter-btn" onclick="setFilter('cluster',this)">Clustering</button>
    <button class="filter-btn" onclick="setFilter('prob',this)">Probability</button>
  </div>

  <div class="count-badge" id="countBadge"></div>
  <div class="cards-list" id="cardsList"></div>
</main>

<div class="toast" id="toast">✓ Copied to clipboard!</div>

<script>
const practicals = [
  {
    id: 1,
    num: "Practical 1",
    category: "ml",
    tag: "ml",
    tagLabel: "ML / PCA",
    title: "Principal Component Analysis (PCA) — Iris Dataset",
    aim: "To perform and analyze dimensionality reduction on real-world datasets using Principal Component Analysis (PCA) by applying matrix representation, covariance matrix, eigenvalues, and eigenvectors.",
    desc: "Implements PCA from scratch using NumPy: standardize → covariance matrix → eigendecomposition → project to 2D → visualize.",
    code: `<span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">import</span> pandas <span class="kw">as</span> pd
<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt
<span class="kw">from</span> sklearn.datasets <span class="kw">import</span> load_iris
<span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> StandardScaler

<span class="cm"># STEP 1: Load Dataset</span>
iris = <span class="fn">load_iris</span>()
X = iris.data
y = iris.target
feature_names = iris.feature_names
df = pd.<span class="fn">DataFrame</span>(X, columns=feature_names)
<span class="op">print</span>(<span class="st">"First 5 rows of Dataset:\n"</span>)
<span class="op">print</span>(df.<span class="fn">head</span>())

<span class="cm"># STEP 2: Standardize the Data</span>
scaler = <span class="cl">StandardScaler</span>()
X_scaled = scaler.<span class="fn">fit_transform</span>(X)
<span class="op">print</span>(<span class="st">"\nStandardized Data Shape:"</span>, X_scaled.shape)

<span class="cm"># STEP 3: Matrix Representation</span>
<span class="op">print</span>(<span class="st">"\nMatrix Representation:"</span>)
<span class="op">print</span>(X_scaled)

<span class="cm"># STEP 4: Covariance Matrix</span>
cov_matrix = np.<span class="fn">cov</span>(X_scaled.T)
<span class="op">print</span>(<span class="st">"\nCovariance Matrix:\n"</span>, cov_matrix)

<span class="cm"># STEP 5: Eigenvalues and Eigenvectors</span>
eigenvalues, eigenvectors = np.linalg.<span class="fn">eig</span>(cov_matrix)
<span class="op">print</span>(<span class="st">"\nEigenvalues:\n"</span>, eigenvalues)
<span class="op">print</span>(<span class="st">"\nEigenvectors:\n"</span>, eigenvectors)

<span class="cm"># STEP 6: Sort by Eigenvalue</span>
sorted_index = np.<span class="fn">argsort</span>(eigenvalues)[::-<span class="nm">1</span>]
sorted_eigenvalues  = eigenvalues[sorted_index]
sorted_eigenvectors = eigenvectors[:, sorted_index]
<span class="op">print</span>(<span class="st">"\nSorted Eigenvalues:\n"</span>, sorted_eigenvalues)

<span class="cm"># STEP 7: Select 2 Principal Components</span>
n_components = <span class="nm">2</span>
principal_components = sorted_eigenvectors[:, :n_components]
<span class="op">print</span>(<span class="st">"\nPrincipal Components:\n"</span>, principal_components)

<span class="cm"># STEP 8: Transform Data</span>
X_pca = np.<span class="fn">dot</span>(X_scaled, principal_components)
<span class="op">print</span>(<span class="st">"\nTransformed Dataset Shape:"</span>, X_pca.shape)

<span class="cm"># STEP 9: PCA DataFrame</span>
pca_df = pd.<span class="fn">DataFrame</span>(
    data=X_pca,
    columns=[<span class="st">'Principal Component 1'</span>, <span class="st">'Principal Component 2'</span>]
)
pca_df[<span class="st">'Target'</span>] = y
<span class="op">print</span>(<span class="st">"\nPCA DataFrame:\n"</span>, pca_df.<span class="fn">head</span>())

<span class="cm"># STEP 10: Explained Variance</span>
explained_variance = sorted_eigenvalues / np.<span class="fn">sum</span>(sorted_eigenvalues)
<span class="op">print</span>(<span class="st">"\nExplained Variance Ratio:\n"</span>, explained_variance)

<span class="cm"># STEP 11: Visualization</span>
plt.<span class="fn">figure</span>(figsize=(<span class="nm">8</span>, <span class="nm">6</span>))
labels = iris.target_names
<span class="kw">for</span> i <span class="kw">in</span> <span class="op">range</span>(<span class="nm">3</span>):
    plt.<span class="fn">scatter</span>(X_pca[y == i, <span class="nm">0</span>], X_pca[y == i, <span class="nm">1</span>], label=labels[i])
plt.<span class="fn">xlabel</span>(<span class="st">'Principal Component 1'</span>)
plt.<span class="fn">ylabel</span>(<span class="st">'Principal Component 2'</span>)
plt.<span class="fn">title</span>(<span class="st">'PCA on Iris Dataset'</span>)
plt.<span class="fn">legend</span>()
plt.<span class="fn">grid</span>(<span class="kw">True</span>)
plt.<span class="fn">show</span>()

<span class="cm"># STEP 12: Analysis</span>
<span class="op">print</span>(<span class="st">"\nANALYSIS:"</span>)
<span class="op">print</span>(<span class="st">"1. PCA reduces dimensionality while preserving maximum variance."</span>)
<span class="op">print</span>(<span class="st">"2. Covariance matrix shows relationships between features."</span>)
<span class="op">print</span>(<span class="st">"3. Eigenvalues represent variance captured by each component."</span>)
<span class="op">print</span>(<span class="st">"4. Eigenvectors represent directions of principal components."</span>)
<span class="op">print</span>(<span class="st">"5. First two PCs capture most of the dataset information."</span>)`
  },
  {
    id: 10,
    num: "Practical 2",
    category: "prob",
    tag: "prob",
    tagLabel: "Probability",
    title: "Probability Distributions — Bernoulli, Binomial, Poisson, Normal, Chi-Square",
    desc: "Generates and plots 5 probability distributions (discrete & continuous) using scipy.stats with mean, variance and theoretical curves.",
    code: `<span class="kw">import</span> numpy <span class="kw">as</span> np
<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt
<span class="kw">from</span> scipy.stats <span class="kw">import</span> bernoulli, binom, poisson, norm, chi2

np.random.<span class="fn">seed</span>(<span class="nm">42</span>)

<span class="cm"># ── A) DISCRETE DISTRIBUTIONS ──────────────────────────────────</span>

<span class="cm"># 1. Bernoulli Distribution</span>
<span class="cm"># Two outcomes: Success=1, Failure=0</span>
p = <span class="nm">0.7</span>
bernoulli_data = bernoulli.<span class="fn">rvs</span>(p, size=<span class="nm">1000</span>)
<span class="op">print</span>(<span class="st">"== BERNOULLI DISTRIBUTION =="</span>)
<span class="op">print</span>(<span class="st">"Mean:"</span>, np.<span class="fn">mean</span>(bernoulli_data))
<span class="op">print</span>(<span class="st">"Variance:"</span>, np.<span class="fn">var</span>(bernoulli_data))
plt.<span class="fn">figure</span>(figsize=(<span class="nm">6</span>, <span class="nm">4</span>))
plt.<span class="fn">hist</span>(bernoulli_data, bins=<span class="nm">2</span>, density=<span class="kw">True</span>, edgecolor=<span class="st">'black'</span>)
plt.<span class="fn">title</span>(<span class="st">"Bernoulli Distribution"</span>)
plt.<span class="fn">xlabel</span>(<span class="st">"Outcome"</span>); plt.<span class="fn">ylabel</span>(<span class="st">"Probability"</span>)
plt.<span class="fn">grid</span>(<span class="kw">True</span>); plt.<span class="fn">show</span>()

<span class="cm"># 2. Binomial Distribution</span>
<span class="cm"># Number of successes in n independent Bernoulli trials</span>
n, p = <span class="nm">10</span>, <span class="nm">0.5</span>
binomial_data = binom.<span class="fn">rvs</span>(n, p, size=<span class="nm">1000</span>)
<span class="op">print</span>(<span class="st">"\n== BINOMIAL DISTRIBUTION =="</span>)
<span class="op">print</span>(<span class="st">"Mean:"</span>, np.<span class="fn">mean</span>(binomial_data))
<span class="op">print</span>(<span class="st">"Variance:"</span>, np.<span class="fn">var</span>(binomial_data))
plt.<span class="fn">figure</span>(figsize=(<span class="nm">7</span>, <span class="nm">4</span>))
plt.<span class="fn">hist</span>(binomial_data, bins=<span class="nm">10</span>, density=<span class="kw">True</span>, edgecolor=<span class="st">'black'</span>)
plt.<span class="fn">title</span>(<span class="st">"Binomial Distribution"</span>)
plt.<span class="fn">xlabel</span>(<span class="st">"Number of Successes"</span>); plt.<span class="fn">ylabel</span>(<span class="st">"Probability"</span>)
plt.<span class="fn">grid</span>(<span class="kw">True</span>); plt.<span class="fn">show</span>()

<span class="cm"># 3. Poisson Distribution</span>
<span class="cm"># Models rare events occurring independently</span>
lambda_value = <span class="nm">4</span>
poisson_data = poisson.<span class="fn">rvs</span>(mu=lambda_value, size=<span class="nm">1000</span>)
<span class="op">print</span>(<span class="st">"\n== POISSON DISTRIBUTION =="</span>)
<span class="op">print</span>(<span class="st">"Mean:"</span>, np.<span class="fn">mean</span>(poisson_data))
<span class="op">print</span>(<span class="st">"Variance:"</span>, np.<span class="fn">var</span>(poisson_data))
plt.<span class="fn">figure</span>(figsize=(<span class="nm">7</span>, <span class="nm">4</span>))
plt.<span class="fn">hist</span>(poisson_data, bins=<span class="nm">15</span>, density=<span class="kw">True</span>, edgecolor=<span class="st">'black'</span>)
plt.<span class="fn">title</span>(<span class="st">"Poisson Distribution"</span>)
plt.<span class="fn">xlabel</span>(<span class="st">"Events"</span>); plt.<span class="fn">ylabel</span>(<span class="st">"Probability"</span>)
plt.<span class="fn">grid</span>(<span class="kw">True</span>); plt.<span class="fn">show</span>()

<span class="cm"># ── B) CONTINUOUS DISTRIBUTIONS ────────────────────────────────</span>

<span class="cm"># 4. Gaussian (Normal) Distribution</span>
<span class="cm"># Symmetric bell-shaped distribution</span>
mean, std_dev = <span class="nm">0</span>, <span class="nm">1</span>
normal_data = norm.<span class="fn">rvs</span>(loc=mean, scale=std_dev, size=<span class="nm">1000</span>)
<span class="op">print</span>(<span class="st">"\n== NORMAL DISTRIBUTION =="</span>)
<span class="op">print</span>(<span class="st">"Mean:"</span>, np.<span class="fn">mean</span>(normal_data))
<span class="op">print</span>(<span class="st">"Variance:"</span>, np.<span class="fn">var</span>(normal_data))
plt.<span class="fn">figure</span>(figsize=(<span class="nm">7</span>, <span class="nm">4</span>))
plt.<span class="fn">hist</span>(normal_data, bins=<span class="nm">30</span>, density=<span class="kw">True</span>, edgecolor=<span class="st">'black'</span>)
x = np.<span class="fn">linspace</span>(-<span class="nm">4</span>, <span class="nm">4</span>, <span class="nm">1000</span>)
plt.<span class="fn">plot</span>(x, norm.<span class="fn">pdf</span>(x, mean, std_dev), linewidth=<span class="nm">2</span>)   <span class="cm"># theoretical curve</span>
plt.<span class="fn">title</span>(<span class="st">"Gaussian (Normal) Distribution"</span>)
plt.<span class="fn">xlabel</span>(<span class="st">"Value"</span>); plt.<span class="fn">ylabel</span>(<span class="st">"Density"</span>)
plt.<span class="fn">grid</span>(<span class="kw">True</span>); plt.<span class="fn">show</span>()

<span class="cm"># 5. Chi-Square Distribution</span>
<span class="cm"># Used in hypothesis testing</span>
degrees_of_freedom = <span class="nm">5</span>
chi_square_data = chi2.<span class="fn">rvs</span>(df=degrees_of_freedom, size=<span class="nm">1000</span>)
<span class="op">print</span>(<span class="st">"\n== CHI-SQUARE DISTRIBUTION =="</span>)
<span class="op">print</span>(<span class="st">"Mean:"</span>, np.<span class="fn">mean</span>(chi_square_data))
<span class="op">print</span>(<span class="st">"Variance:"</span>, np.<span class="fn">var</span>(chi_square_data))
plt.<span class="fn">figure</span>(figsize=(<span class="nm">7</span>, <span class="nm">4</span>))
plt.<span class="fn">hist</span>(chi_square_data, bins=<span class="nm">30</span>, density=<span class="kw">True</span>, edgecolor=<span class="st">'black'</span>)
x = np.<span class="fn">linspace</span>(<span class="nm">0</span>, <span class="nm">20</span>, <span class="nm">1000</span>)
plt.<span class="fn">plot</span>(x, chi2.<span class="fn">pdf</span>(x, degrees_of_freedom), linewidth=<span class="nm">2</span>)  <span class="cm"># theoretical curve</span>
plt.<span class="fn">title</span>(<span class="st">"Chi-Square Distribution"</span>)

let currentFilter = 'all';
let currentSearch = '';

function rawCode(htmlCode) {
  const d = document.createElement('div');
  d.innerHTML = htmlCode;
  return d.textContent;
}

function renderCards() {
  const list  = document.getElementById('cardsList');
  const badge = document.getElementById('countBadge');
  const q = currentSearch.toLowerCase();

  const order = ['Practical 1','Practical 2','Practical 3','Practical 4','Practical 5','Practical 6A','Practical 6B','Practical 7','Practical 8'];
  practicals.sort((a,b) => order.indexOf(a.num) - order.indexOf(b.num));

  const filtered = practicals.filter(p => {
    const matchCat = currentFilter === 'all' || p.category === currentFilter;
    const matchQ   = !q || p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.num.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  badge.innerHTML = `Showing <span>${filtered.length}</span> of ${practicals.length} practicals`;

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">No practicals found for "<strong>${currentSearch}</strong>"</div>`;
    return;
  }

  list.innerHTML = filtered.map((p, i) => `
    <div class="card" style="animation-delay:${i*0.05}s" id="card-${p.id}">
      <div class="card-header" onclick="toggleCard(${p.id})">
        <div class="card-meta">
          <span class="prac-num">${p.num}</span>
          <span class="tag tag-${p.tag}">${p.tagLabel}</span>
          <span class="card-title">${p.title}</span>
        </div>
        <div class="card-actions">
          <button class="copy-btn" id="copybtn-${p.id}" onclick="event.stopPropagation(); copyCode(${p.id})">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
          <svg class="chevron" id="chev-${p.id}" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="card-body" id="body-${p.id}">
        <div class="card-desc"># ${p.desc}</div>
        <div class="code-wrap"><pre>${p.code}</pre></div>
      </div>
    </div>
  `).join('');
}

function toggleCard(id) {
  const body = document.getElementById(`body-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

function copyCode(id) {
  const p = practicals.find(x => x.id === id);
  if (!p) return;
  navigator.clipboard.writeText(rawCode(p.code)).then(() => {
    const btn = document.getElementById(`copybtn-${id}`);
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
    showToast();
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
    }, 2500);
  });
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function filterCards() {
  currentSearch = document.getElementById('searchInput').value;
  renderCards();
}

renderCards();
</script>
